services:
  backend:
    build:
      context: ./src/backend
    container_name: simucell-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./src/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    container_name: simucell-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
